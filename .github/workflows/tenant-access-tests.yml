name: Tenant access tests
on:
  pull_request:
  push:
    branches: [main]
permissions:
  contents: read
jobs:
  authorization:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Test policy and scoped profile handler
        run: node --test tests/*.test.mjs
